<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Web Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎨 3D Web Editor</h1>

  <div id="editor">
    <div id="controls">
      <label for="shapeSelect">3D Shape:</label>
      <select id="shapeSelect">
        <option value="box">Cube</option>
        <option value="sphere">Sphere</option>
        <option value="cone">Cone</option>
        <option value="cylinder">Cylinder</option>
        <option value="torus">Torus</option>
        <option value="octahedron">Octahedron</option>
      </select>
      <button id="addShapeBtn">Add Shape</button>

      <label for="iconSelect">3D Icon:</label>
      <select id="iconSelect">
        <option value="⭐">⭐ Star</option>
        <option value="❤️">❤️ Heart</option>
        <option value="⚡">⚡ Bolt</option>
        <option value="🎵">🎵 Note</option>
        <option value="🚀">🚀 Rocket</option>
        <option value="🌈">🌈 Rainbow</option>
      </select>
      <button id="addIconBtn">Add Icon</button>

      <label for="textInput">3D Colourful Font:</label>
      <input type="text" id="textInput" value="3D Fun" maxlength="20">
      <button id="addTextBtn">Add Text</button>

      <label for="colorPicker">Color:</label>
      <input type="color" id="colorPicker" value="#ff4d6d">

      <label for="rotateRange">Rotate:</label>
      <input type="range" id="rotateRange" min="0" max="360" value="0">

      <label for="scaleRange">Scale:</label>
      <input type="range" id="scaleRange" min="0.5" max="4" step="0.1" value="1">

      <p class="hint">Tip: Drag any object inside the 3D canvas to move it.</p>
    </div>

    <div id="canvasContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/geometries/TextGeometry.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/DragControls.js"></script>
  <script src="script.js"></script>
</body>
</html>
