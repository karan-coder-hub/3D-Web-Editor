<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Web Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎨 3D Web Editor</h1>
  
  <div id="editor">
    <div id="controls">
      <label>Color:</label>
      <input type="color" id="colorPicker" value="#ff0000"><br>

      <label>Rotate:</label>
      <input type="range" id="rotateRange" min="0" max="360" value="0"><br>

      <label>Scale:</label>
      <input type="range" id="scaleRange" min="1" max="5" step="0.1" value="1">
    </div>

    <div id="canvasContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
